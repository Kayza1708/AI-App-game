<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="AI Singularity — build the intelligence company that changes everything." />
    <title>AI Singularity</title>
  </head>
  <body>
    <div id="app"><main id="boot-status" role="status" style="min-height:100vh;display:grid;place-content:center;gap:12px;padding:24px;background:#05080d;color:#edf8f7;font:14px system-ui;text-align:center"><strong style="color:#4de8d1;letter-spacing:.12em">AI SINGULARITY</strong><span>INITIALIZING COMPANY SYSTEMS…</span><pre id="boot-error" style="display:none;max-width:720px;overflow:auto;white-space:pre-wrap;color:#ff9ca5;text-align:left"></pre></main></div>
    <noscript>AI Singularity requires JavaScript to run.</noscript>
    <script>
      (function () {
        var timer = setTimeout(function () {
          var status = document.getElementById('boot-status');
          if (status) status.querySelector('span').textContent = 'STARTUP IS TAKING TOO LONG — CHECK THE ERROR BELOW OR RELOAD.';
        }, 8000);
        window.addEventListener('error', function (event) {
          clearTimeout(timer);
          var output = document.getElementById('boot-error');
          if (!output) return;
          output.style.display = 'block';
          output.textContent = String(event.error && event.error.stack || event.message || 'Module failed to load');
        });
      }());
    </script>
    <script type="module" src="/src/main.js?v=0.15.1"></script>
  </body>
</html>
